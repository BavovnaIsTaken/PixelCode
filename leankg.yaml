project:
  name: PixelCode
  root: .
  languages:
  - typescript
  - javascript
  - kotlin
indexer:
  exclude:
  - '**/node_modules/**'
  - '**/vendor/**'
  - '**/build/**'
  - '**/.dart_tool/**'
  - '**/coverage/**'
  - '**/.claude/worktrees/**'
  include:
  - '*.ts'
  - '*.js'
  - '*.kt'
  - '*.dart'
mcp:
  enabled: true
  port: 3000
  auth_token: ''
  auto_index_on_start: true
  auto_index_threshold_minutes: 5
  auto_index_on_db_write: true
documentation:
  output: ./docs
  templates:
  - agents
  - claude
microservice: null
